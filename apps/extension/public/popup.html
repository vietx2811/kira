<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIRA Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="is-checking-kira">
    <main class="popup-shell">
      <header>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-square"></span>
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 1.75c.73 3.52 3.48 6.27 7 7-.01.01-.01.01 0 0-3.52.73-6.27 3.48-7 7-.73-3.52-3.48-6.27-7-7 3.52-.73 6.27-3.48 7-7Z" />
            </svg>
          </span>
          <strong>KIRA</strong>
        </div>
        <span id="capture-kind">Page</span>
      </header>
      <section id="app-unavailable" class="app-unavailable" role="status" hidden>
        <span class="brand-mark brand-mark--large" aria-hidden="true">
          <span class="brand-square"></span>
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 1.75c.73 3.52 3.48 6.27 7 7-.01.01-.01.01 0 0-3.52.73-6.27 3.48-7 7-.73-3.52-3.48-6.27-7-7 3.52-.73 6.27-3.48 7-7Z" />
          </svg>
        </span>
        <p>Mở <strong>Kira App</strong> để sử dụng tính năng này</p>
      </section>
      <section class="capture-card">
        <img id="capture-preview" alt="" hidden />
        <div>
          <h1 id="capture-title">Current tab</h1>
          <p id="capture-source"></p>
        </div>
      </section>
      <section id="image-section" class="image-section" hidden>
        <div class="section-row">
          <span>Batch Save</span>
          <button id="toggle-images" type="button">All</button>
        </div>
        <div class="filter-row" aria-label="Image filters">
          <label>
            Min width
            <input id="min-width" type="number" min="0" step="100" value="160" />
          </label>
          <label>
            Min height
            <input id="min-height" type="number" min="0" step="100" value="120" />
          </label>
          <label>
            Format
            <select id="format-filter">
              <option value="all">All</option>
              <option value="jpg">JPG</option>
              <option value="png">PNG</option>
              <option value="webp">WEBP</option>
              <option value="gif">GIF</option>
              <option value="svg">SVG</option>
            </select>
          </label>
        </div>
        <div id="image-grid" class="image-grid" aria-label="Page images"></div>
      </section>
      <section class="categorize-section" aria-label="Categorize">
        <input id="capture-tags" type="text" placeholder="Tags, comma separated" />
        <input id="capture-note" type="text" placeholder="Note" />
      </section>
      <button id="copy-capture" type="button">Send to KIRA</button>
      <p id="status" role="status">Paste in KIRA Library</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
