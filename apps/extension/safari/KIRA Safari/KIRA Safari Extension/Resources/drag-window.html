<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIRA Capture Targets</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="drag-window.css" />
  </head>
  <body>
    <main class="capture-shell">
      <header>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 1.75c.73 3.52 3.48 6.27 7 7-3.52.73-6.27 3.48-7 7-.73-3.52-3.48-6.27-7-7 3.52-.73 6.27-3.48 7-7Z" />
            </svg>
          </span>
          <div>
            <strong>KIRA Capture</strong>
            <span id="file-title">Current file</span>
          </div>
        </div>
        <span id="status">Drop target ready</span>
      </header>
      <section id="app-unavailable" class="app-unavailable" hidden>
        <span class="brand-mark brand-mark--large" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 1.75c.73 3.52 3.48 6.27 7 7-3.52.73-6.27 3.48-7 7-.73-3.52-3.48-6.27-7-7 3.52-.73 6.27-3.48 7-7Z" />
          </svg>
        </span>
        <p>Mở <strong>Kira App</strong> để sử dụng tính năng này</p>
      </section>
      <section class="capture-grid">
        <div class="undecided drop-target" data-target="undecided">
          <span>Undecided</span>
          <strong>Inbox</strong>
          <small>Drop here to keep the image unassigned.</small>
        </div>
        <div class="target-column">
          <div class="create-target drop-target" data-target="create">
            <span>Create New Node or Select Nodes</span>
            <div id="combo" class="combo" hidden>
              <input id="combo-input" type="text" placeholder="Search node or type new node name" autocomplete="off" />
              <div id="combo-list" class="combo-list"></div>
            </div>
          </div>
          <div id="node-list" class="node-list"></div>
        </div>
      </section>
    </main>
    <script type="module" src="drag-window.js"></script>
  </body>
</html>
